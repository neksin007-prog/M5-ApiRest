services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: laravel_eventos
      MARIADB_USER: laravel
      MARIADB_PASSWORD: secret
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      laravel-network:
        ipv4_address: 172.18.0.2

  application:
    build: .
    network_mode: host
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./src:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:

networks:
  laravel-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1